<!DOCTYPE html><html lang="pt-AO"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | Milomércios</title><link rel="stylesheet" href="Style.css"></head><body><header><div class="logo">Milomércios</div><a href="index.html" style="color:white">Loja</a></header><main class="card" style="max-width:520px;margin:30px auto"><h2>Criar conta</h2><p style="color:#667585">A conta de cliente é gratuita. Para vender, será necessário solicitar aprovação e pagar a subscrição semanal ou mensal definida pelo administrador.</p><label>Tipo de conta</label><select id="reg-tipo"><option value="cliente">Quero comprar</option><option value="vendedor">Quero vender</option></select><label>Nome</label><input id="reg-nome" placeholder="Seu nome"><label>Nome da loja <small>(apenas vendedor)</small></label><input id="reg-loja" placeholder="Nome da sua loja"><label>E-mail</label><input id="reg-email" type="email" placeholder="seu@email.com"><label>Senha</label><input id="reg-senha" type="password" placeholder="Mínimo 6 caracteres"><button class="btn" id="btn-registar">Criar conta</button><p style="margin-top:15px">Já tem conta? <a href="login.html">Entrar</a></p></main><script type="module" src="registo.js"></script></body></html>
