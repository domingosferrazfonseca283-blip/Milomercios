ts{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.store-products{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.store-card img,.store-card .placeholder{height:145px}.store-head{padding:23px}.store-head h1{font-size:1.55rem}.store-avatar,.store-logo{width:64px;height:64px;flex-basis:64px}}@media(max-width:380px){.store-products{grid-template-columns:1fr}.store-head{align-items:flex-start}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"><i class="fas fa-store"></i></span><span>Milomércios</span></a><nav class="main-nav"><a href="index.html"><i class="fas fa-house"></i> Início</a><a class="cart-link" href="carrinho.html"><i class="fas fa-shopping-cart"></i><span>Carrinho</span><b id="cart-count">0</b></a></nav></header><main class="store-wrap"><a class="back" href="index.html" style="display:inline-flex;margin-bottom:15px;color:var(--primaria);font-weight:700;text-decoration:none"><i class="fas fa-arrow-left"></i>&nbsp; Voltar ao catálogo</a><section id="store-head" class="store-head"><div class="store-avatar"><i class="fas fa-store"></i></div><div><h1>A carregar loja...</h1><p>Produtos deste vendedor</p></div></section><section><div class="section-heading"><div><span class="section-kicker">LOJA</span><h2>Produtos disponíveis</h2></div></div><div id="products" class="store-products"><div class="loader">A carregar produtos...</div></div></section></main><footer class="site-footer"><div><strong>Milomércios</strong><span>Marketplace angolano para comprar e vender.</span></div><div class="footer-links"><a href="index.html">Início</a><a href="registo.html">Vender</a><a href="carrinho.html">Carrinho</a></div></footer><script type="module" src="loja.js"></script></body></html>
