    .tracking-page{max-width:980px;margin:0 auto;padding:42px 20px 70px}.tracking-hero{margin-bottom:22px}.tracking-hero h1{margin:8px 0}.tracking-hero p{color:#64748b}.back-link{display:inline-flex;gap:8px;align-items:center;margin-bottom:16px;color:inherit;text-decoration:none;font-weight:700}.order-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.summary-item{padding:18px;border:1px solid #e2e8f0;border-radius:16px;background:#fff}.summary-item span{display:block;color:#64748b;font-size:.85rem;margin-bottom:6px}.summary-item strong{display:block;overflow-wrap:anywhere}.tracking-card{padding:26px}.timeline{position:relative;margin:28px 0 8px;padding-left:12px}.timeline:before{content:"";position:absolute;left:23px;top:16px;bottom:16px;width:3px;background:#e2e8f0}.timeline-step{position:relative;display:flex;gap:18px;min-height:76px}.timeline-dot{z-index:1;width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;color:#fff;font-size:12px}.timeline-step.done .timeline-dot,.timeline-step.current .timeline-dot{background:#0f766e}.timeline-step.cancelled .timeline-dot{background:#dc2626}.timeline-content h3{font-size:1rem;margin:1px 0 4px}.timeline-content p{margin:0;color:#64748b;font-size:.9rem}.empty-tracking{text-align:center;padding:55px 20px}.empty-tracking i{font-size:2rem;margin-bottom:12px}.tracking-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:700px){.tracking-page{padding:28px 14px 50px}.order-summary{grid-template-columns:1fr}.tracking-card{padding:20px}.timeline{padding-left:4px}.timeline:before{left:15px}.timeline-dot{width:24px;height:24px;flex-basis:24px}}
  </style>
