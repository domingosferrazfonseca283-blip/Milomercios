<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhes do produto no Milomércios."><title>Produto | Milomércios</title>
  <link rel="stylesheet" href="Style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .detail-wrap{max-width:1180px;margin:28px auto 60px;padding:0 18px}.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;color:var(--primaria);font-weight:800;text-decoration:none}.detail-card{background:#fff;border:1px solid var(--linha);border-radius:22px;padding:22px;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:34px;box-shadow:var(--sombra)}.detail-media{position:relative}.detail-image{width:100%;height:510px;object-fit:cover;border-radius:17px;background:#eef2f5}.detail-image.placeholder{display:grid;place-items:center;color:#9aa7b3;font-size:4rem}.detail-badge{position:absolute;top:14px;left:14px;background:#fff;color:var(--primaria);padding:7px 11px;border-radius:999px;font-size:.76rem;font-weight:850;box-shadow:0 6px 18px rgba(0,0,0,.1)}.detail-info{padding:8px 6px}.detail-info h1{font-size:clamp(2rem,4vw,3rem);line-height:1.06;letter-spacing:-.045em;margin:7px 0 13px}.detail-price{font-size:2rem;font-weight:900;color:var(--primaria);margin:17px 0 8px}.detail-description{color:var(--muted);white-space:pre-line;margin:18px 0;line-height:1.7}.detail-stock{font-weight:800;margin:8px 0 16px}.detail-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}.detail-actions .btn-buy{margin:0;min-height:45px;padding:0 20px}.qty{display:flex;align-items:center;border:1px solid var(--linha);border-radius:11px;overflow:hidden;background:#fff}.qty button{width:43px;height:45px;border:0;background:#f4f6f8;color:var(--primaria);font-size:1.15rem;font-weight:900;cursor:pointer}.qty button:hover{background:#eaf0f4}.qty span{min-width:42px;text-align:center;font-weight:850}.store-box{margin-top:25px;padding:17px;border-radius:14px;background:#f6f8fa;border:1px solid var(--linha)}.store-box strong{color:var(--primaria)}.store-box p{color:var(--muted);margin:4px 0 10px}.notice{max-width:700px;margin:50px auto;padding:34px;text-align:center;background:#fff;border-radius:18px;border:1px solid var(--linha);box-shadow:var(--sombra)}.notice i{font-size:2rem;color:var(--detalhe);margin-bottom:12px}.rating-summary{display:flex;align-items:center;gap:9px;margin:7px 0}.stars{letter-spacing:2px;font-size:1.2rem;color:#ff9d1a}.rating-summary span:last-child{color:var(--muted);font-size:.9rem}.reviews{margin-top:24px;background:#fff;border:1px solid var(--linha);border-radius:20px;padding:24px;box-shadow:var(--sombra)}.reviews h2{margin-bottom:8px}.review{padding:16px 0;border-bottom:1px solid var(--linha)}.review:last-child{border-bottom:0}.review p{color:var(--muted);white-space:pre-line;margin-top:7px}.muted{color:var(--muted)}.review-form{margin-top:22px;padding-top:20px;border-top:1px solid var(--linha)}.star-input{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px;margin:10px 0}.star-input input{position:absolute;opacity:0}.star-input label span{font-size:1.8rem;cursor:pointer;color:#b8c0c7}.star-input label:hover span,.star-input label:hover~label span,.star-input input:checked~span{color:#ff9d1a}.review-form textarea{width:100%;min-height:100px;box-sizing:border-box;border:1px solid var(--linha);border-radius:10px;padding:12px;margin:8px 0 12px;font:inherit}.reviews .btn-buy{max-width:260px}.trust-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.trust-item{padding:12px;border:1px solid var(--linha);border-radius:12px;background:#fff}.trust-item i{color:var(--sucesso);margin-right:6px}.trust-item small{color:var(--muted)}
    @media(max-width:800px){.detail-card{grid-template-columns:1fr;padding:15px;gap:20px}.detail-image{height:390px}.detail-info{padding:3px}.trust-row{grid-template-columns:1fr}.detail-actions .btn-buy{flex:1}}
    @media(max-width:520px){.detail-wrap{margin-top:17px;padding:0 12px}.detail-card{border-radius:17px}.detail-image{height:310px}.detail-info h1{font-size:2rem}.detail-price{font-size:1.7rem}.detail-actions{display:grid;grid-template-columns:auto 1fr}.detail-actions .btn-buy{width:100%}.reviews{padding:18px}}
  </style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"><i class="fas fa-store"></i></span><span>Milomércios</span></a><nav class="main-nav"><a href="index.html"><i class="fas fa-house"></i> <span>Início</span></a><a class="cart-link" href="carrinho.html"><i class="fas fa-shopping-cart"></i><span>Carrinho</span><b id="cart-count">0</b></a></nav></header>
<main class="detail-wrap"><a class="back" href="index.html"><i class="fas fa-arrow-left"></i> Voltar ao catálogo</a><div id="produto" class="notice">A carregar produto...</div><section class="reviews"><h2>Avaliações</h2><div id="avaliacoes-lista" class="muted">A carregar avaliações...</div><div id="avaliacao-form" class="review-form"></div></section></main>
<footer class="site-footer"><div><strong>Milomércios</strong><span>Marketplace angolano para comprar e vender.</span></div><div class="footer-links"><a href="index.html">Início</a><a href="registo.html">Vender</a><a href="carrinho.html">Carrinho</a></div></footer>
<script type="module" src="produto.js"></script>
</body></html>
