<!DOCTYPE html><html lang="pt-AO"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendedor | Milomércios</title><link rel="stylesheet" href="Style.css"></head><body><header><button id="btn-logout">Sair</button><div class="logo">Painel do Vendedor</div><a href="index.html" style="color:white">Ver Loja</a></header><main style="max-width:1000px;margin:25px auto;padding:0 15px"><section class="card"><h2 id="nome-loja">Minha loja</h2><p id="email"></p><p id="estado">A validar...</p></section><section class="card"><h3>Subscrição</h3><p id="sub-info">A carregar...</p><button class="btn" id="btn-pedir">Solicitar/renovar subscrição</button></section><section class="card"><h3>Adicionar produto</h3><input id="produto-nome" placeholder="Nome do produto"><input id="produto-preco" type="number" min="0.01" step="0.01" placeholder="Preço (Kz)"><input id="produto-stock" type="number" min="0" step="1" placeholder="Quantidade em stock"><input id="produto-categoria" placeholder="Categoria"><textarea id="produto-descricao" placeholder="Descrição"></textarea><button class="btn" id="btn-produto">Publicar produto</button></section><section class="card"><h3>Meus produtos</h3><div id="produtos-list">A carregar...</div></section><section class="card"><h3>Encomendas / Vendas</h3><div id="pedidos-list">A carregar...</div></section></main><script type="module" src="vendedor.js"></script></body></html>
